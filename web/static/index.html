<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Service Deployer · 控制台</title>
<style>
/* ============================================================
   设计令牌 —— 与 Ardot 画板 1:1 对齐
   底 #0A0D12 / 面板 #0D1117 / 卡片 #11151C
   描边 #1E2634 · #2C3848
   文字 #E6EDF3 · #93A1B3 · #5D6B7C
   强调 #00E07A + cyan #22D3EE / violet #A78BFA / blue #4D9FFF / amber #FFB020 / red #FF5D5D
   ============================================================ */
:root{
  --bg:#0A0D12; --panel:#0D1117; --card:#11151C; --line:#1E2634; --line2:#2C3848;
  --text:#E6EDF3; --t2:#93A1B3; --t3:#5D6B7C;
  --accent:#00E07A; --cyan:#22D3EE; --violet:#A78BFA; --blue:#4D9FFF; --amber:#FFB020; --red:#FF5D5D;
  --ui:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
  --mono:'Geist Mono','SF Mono','Cascadia Code','JetBrains Mono',Consolas,ui-monospace,monospace;
  --r-card:10px; --r-btn:6px; --r-pill:4px; --r-cmd:5px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--ui); font-size:12.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
.mono{font-family:var(--mono)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;color:inherit;outline:none}
/* 内联 SVG 默认尺寸兜底：未显式指定尺寸的图标不得退回 300×150 替换元素尺寸 */
svg{width:12px;height:12px;flex:0 0 12px;min-width:0;flex-shrink:0}
::selection{background:rgba(0,224,122,.25)}

/* 滚动条 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#1E2634;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#2C3848}
::-webkit-scrollbar-track{background:transparent}

/* ================= 外壳骨架 ================= */
.shell{height:100%;display:flex;flex-direction:column}
.topbar{
  flex:0 0 56px;height:56px;display:flex;align-items:center;gap:14px;
  padding:0 20px;background:var(--bg);user-select:none;
}
.topbar-sep{flex:0 0 1px;height:1px;background:var(--line)}
.main{flex:1;display:flex;min-height:0}

/* ================= 顶栏 ================= */
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand-logo{
  width:26px;height:26px;border-radius:6px;flex:0 0 26px;
  background:rgba(0,224,122,.10);border:1px solid rgba(0,224,122,.40);
  display:grid;place-items:center;
}
.brand-logo svg{width:13px;height:13px}
.brand-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap}
.brand-ver{
  font-family:var(--mono);font-size:11px;font-weight:500;color:var(--t2);
  padding:3px 7px;border-radius:var(--r-pill);
  background:var(--card);border:1px solid var(--line2);white-space:nowrap;
}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap}
.crumb .sep{font-family:var(--mono);color:var(--line2)}
.crumb .up{color:var(--t2)}
.crumb .cur{color:var(--text);font-weight:500}
.crumb .up.link{cursor:pointer}
.crumb .up.link:hover{color:var(--text)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}

/* 空间切换器 */
.space-switch{position:relative}
.space-btn{
  display:flex;align-items:center;gap:8px;padding:6px 11px;border-radius:var(--r-btn);
  background:rgba(0,224,122,.08);border:1px solid rgba(0,224,122,.30);
  font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--accent);
}
.space-btn:hover{background:rgba(0,224,122,.14)}
.space-btn .chev{width:8px;height:8px;border-right:1.4px solid var(--accent);border-bottom:1.4px solid var(--accent);transform:rotate(45deg) translateY(-2px);margin-left:2px}

/* ================= 按钮 ================= */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:var(--r-btn);
  background:var(--card);border:1px solid var(--line2);
  font-size:12.5px;font-weight:500;color:var(--t2);white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s;
}
.btn:hover{background:#161B23;border-color:#3A4759;color:var(--text)}
.btn svg{width:12px;height:12px;flex:0 0 12px}
.btn--primary{background:var(--accent);border-color:var(--accent);color:#04120A;font-weight:600}
.btn--primary:hover{background:#22F08C;border-color:#22F08C;color:#04120A}
.btn--danger{background:rgba(255,93,93,.10);border-color:rgba(255,93,93,.35);color:var(--red);font-weight:500}
.btn--danger:hover{background:rgba(255,93,93,.18);border-color:rgba(255,93,93,.55);color:var(--red)}
.btn--quiet{background:transparent;border-color:transparent;color:var(--t2);padding:8px 10px}
.btn--quiet:hover{background:var(--card);border-color:var(--line2);color:var(--text)}
.btn--sm{padding:5px 11px;font-size:12px}

/* ================= 侧边栏 ================= */
.side{
  flex:0 0 232px;width:232px;background:var(--panel);
  display:flex;flex-direction:column;gap:18px;
  padding:16px 14px 12px;overflow-y:auto;
}
.side-sep{flex:0 0 1px;width:1px;background:var(--line)}
.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-label{
  font-family:var(--mono);font-size:10px;font-weight:500;
  color:var(--t3);letter-spacing:.04em;padding:0 9px;margin-bottom:2px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:8px 9px;border-radius:var(--r-btn);
  font-size:12.5px;color:var(--t2);text-align:left;
  transition:background .15s,color .15s;
}
.nav-item:hover{background:#141922;color:var(--text)}
.nav-item.is-active{background:var(--line);color:var(--text)}
/* 导航图标：仅侧栏折叠为图标条时显示，完整态严格还原设计稿的纯文字样式 */
.nav-item .ic{display:none}
.nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .ct{font-family:var(--mono);font-size:10.5px;color:var(--t3);flex:0 0 auto}
.nav-item.is-active .ct{color:var(--t2)}
.nav-spacer{flex:1;min-height:12px}
.side-file{
  margin-top:2px;padding:9px 10px;border-radius:var(--r-btn);
  background:var(--card);border:1px solid var(--line);
}
.side-file .p{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--t2)}
.side-file .s{font-size:10px;color:var(--t3);margin-top:3px}

/* ================= 主内容列 ================= */
.col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.content{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.page{padding:18px 24px;display:flex;flex-direction:column;gap:16px;flex:1}
.page.full{padding:0;gap:0;overflow:hidden}

/* ================= 页头 ================= */
.page-head{display:flex;align-items:flex-start;gap:12px;padding:0}
.ph-title{font-size:15px;font-weight:600;color:var(--text);line-height:1.35}
.ph-sub{font-size:11.5px;color:var(--t3);margin-top:5px}
.ph-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto;padding-top:2px}
.h1{font-size:22px;font-weight:700;letter-spacing:-.2px}

/* 搜索框 / 下拉按钮 */
.search{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:var(--r-btn);
  background:var(--card);border:1px solid var(--line2);width:236px;
}
.search svg{width:13px;height:13px;flex:0 0 13px;stroke:var(--t3)}
.search input{
  flex:1;min-width:0;background:none;border:none;
  font-size:12px;color:var(--text);
}
.search input::placeholder{color:var(--t3)}

/* 分组 / 场景筛选下拉：默认隐藏，仅在侧栏折叠为图标条（≤1200）后接管筛选能力 */
.grp-sel{
  display:none;align-items:center;gap:6px;height:34px;padding:0 10px;
  border-radius:var(--r-btn);background:var(--card);border:1px solid var(--line2);
  font-size:12px;color:var(--t2);cursor:pointer;
}
.grp-sel:hover{color:var(--text);border-color:#3A4757}
.grp-sel svg{width:13px;height:13px;flex:0 0 13px;stroke:var(--t3)}
.grp-sel select{
  background:none;border:none;font-size:12px;color:var(--text);
  cursor:pointer;padding-right:2px;
}
.grp-sel select option{background:var(--card);color:var(--text)}

/* ================= 指标条 ================= */
.metrics{
  display:flex;align-items:center;height:62px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  margin:0 -24px;padding:0 24px;
}
.metric{display:flex;flex-direction:column;gap:5px;padding-right:54px}
.metric + .metric{border-left:1px solid var(--line);padding-left:27px}
.metric .k{font-family:var(--mono);font-size:10px;color:var(--t3);letter-spacing:.05em}
.metric .v{font-family:var(--mono);font-size:23px;font-weight:500;color:var(--text);line-height:1}
.metric .v.g{color:var(--accent)}
.metric .v.a{color:var(--amber)}
.metric .v.r{color:var(--red)}

/* ================= 面板 / 卡片 ================= */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card)}
.panel-head{
  display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--line);
}
.panel-title{font-size:13px;font-weight:600;color:var(--text)}
.panel-sub{font-size:11px;color:var(--t3)}
.sec-label{
  font-family:var(--mono);font-size:10px;font-weight:500;color:var(--t3);
  letter-spacing:.06em;
}

/* ================= 数据表格 ================= */
.tbl{display:flex;flex-direction:column;min-width:0}
.tbl-head,.tbl-row{
  display:grid;align-items:center;padding:0 14px;
  grid-template-columns:var(--cols,1fr);
}
.tbl-head{
  height:32px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;color:var(--t3);
}
.tbl-row{height:44px;border-bottom:1px solid #151A22;transition:background .12s}
.tbl-row:last-child{border-bottom:none}
.tbl-row:hover{background:#141922}
.tbl-row.is-click{cursor:pointer}
/* 时间线型列表（部署历史 / 最近部署活动）行高更紧凑 */
.tbl--compact .tbl-row{height:32px}
.cell{display:flex;align-items:center;gap:8px;min-width:0}
.cell .nm{
  font-family:var(--mono);font-size:12.5px;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cell .nm.link{cursor:pointer}
.cell .nm.link:hover{color:var(--accent)}
.cell .dim{font-family:var(--mono);font-size:11.5px;color:var(--t3)}
.cell .val{font-family:var(--mono);font-size:11.5px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.right{justify-content:flex-end}
.ref-link{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:11.5px;color:var(--t2);
  padding:3px 8px;border-radius:var(--r-pill);background:#0F141B;border:1px solid var(--line2);
}
.ref-link svg{width:10px;height:10px;stroke:var(--t3);flex:0 0 10px}

/* ================= 状态 / 徽标 ================= */
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.dot--ok{background:var(--accent);box-shadow:0 0 0 3px rgba(0,224,122,.14)}
.dot--warn{background:var(--amber);box-shadow:0 0 0 3px rgba(255,176,32,.14)}
.dot--err{background:var(--red);box-shadow:0 0 0 3px rgba(255,93,93,.14)}
.dot--muted{background:var(--line2)}
.dot--run{background:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.16)}

.st{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;white-space:nowrap}
.st.ok{color:var(--accent)}
.st.warn{color:var(--amber)}
.st.err{color:var(--red)}

.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:500;
  font-family:var(--mono);white-space:nowrap;
}
.pill--ok{background:rgba(0,224,122,.10);border:1px solid rgba(0,224,122,.30);color:var(--accent);font-family:var(--ui)}
.pill--warn{background:rgba(255,176,32,.10);border:1px solid rgba(255,176,32,.30);color:var(--amber);font-family:var(--ui)}
.pill--err{background:rgba(255,93,93,.10);border:1px solid rgba(255,93,93,.30);color:var(--red);font-family:var(--ui)}
.pill--dim{background:#0F141B;border:1px solid var(--line);color:var(--t3);font-family:var(--ui)}
.pill--run{background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.30);color:var(--cyan);font-family:var(--ui)}

/* 类型 / 阶段 标签 */
.tag{
  font-family:var(--mono);font-size:10.5px;padding:2px 7px;
  border-radius:var(--r-pill);color:var(--t2);background:#0F141B;border:1px solid var(--line);
}
.tag.type{background:none;border:none;padding:2px 0}
.tag.none{color:var(--t3)}

/* ================= 表单 ================= */
.form-sec{display:flex;flex-direction:column;gap:16px}
.sec-hd{
  display:flex;align-items:center;gap:10px;margin-bottom:2px;
}
.sec-hd .no{
  font-family:var(--mono);font-size:10px;font-weight:500;color:var(--t3);letter-spacing:.06em;
}
.sec-hd .rule{flex:1;height:1px;background:var(--line)}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field > label{font-size:11.5px;color:var(--t3);display:flex;align-items:center;gap:6px}
.field .req{color:var(--accent)}
.input{
  width:100%;padding:9px 12px;border-radius:var(--r-btn);
  background:var(--panel);border:1px solid var(--line2);
  font-family:var(--mono);font-size:12px;color:var(--text);
  transition:border-color .15s;
}
.input:hover{border-color:#3A4759}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--t3);font-family:var(--ui)}
.input.ui{font-family:var(--ui)}
.field-note{font-size:10.5px;color:var(--t3);line-height:1.55}

/* 分段控件 */
.seg{display:flex;gap:2px;padding:2px;border-radius:var(--r-btn);background:var(--panel);border:1px solid var(--line)}
.seg button{
  flex:1;padding:7px 10px;border-radius:var(--r-pill);
  font-family:var(--mono);font-size:11.5px;color:var(--t3);
  transition:background .15s,color .15s;white-space:nowrap;
}
.seg button:hover{color:var(--t2)}
.seg button.on{background:var(--line);border:1px solid var(--line2);color:var(--text);font-weight:500}

/* 芯片 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font-family:var(--mono);font-size:11.5px;color:var(--t2);
  padding:5px 11px;border-radius:var(--r-cmd);
  background:var(--card);border:1px solid var(--line2);
}

/* 开关 */
.sw-row{display:flex;align-items:center;gap:14px}
.sw{
  width:36px;height:20px;border-radius:999px;flex:0 0 36px;
  background:var(--line2);position:relative;transition:background .18s;
}
.sw::after{
  content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;
  background:var(--t2);transition:transform .18s,background .18s;
}
.sw.on{background:rgba(0,224,122,.28)}
.sw.on::after{transform:translateX(16px);background:var(--accent)}

/* ================= 命令行 ================= */
.cmd{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;border-radius:var(--r-cmd);
  background:#0F141B;border:1px solid var(--line);
}
.cmd .no{font-family:var(--mono);font-size:10.5px;color:var(--t3);flex:0 0 14px}
.cmd .pr{font-family:var(--mono);font-size:12px;color:var(--accent);flex:0 0 auto}
.cmd .tx{
  flex:1;min-width:0;font-family:var(--mono);font-size:11px;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cmd .ic{flex:0 0 auto;opacity:.5}
.cmd .ic svg{width:12px;height:12px;stroke:var(--t3)}

/* 钩子卡 */
.hook{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  padding:14px 16px;display:flex;flex-direction:column;gap:10px;
}
.hook-hd{display:flex;align-items:center;gap:10px}
.hook-hd .id{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--t2)}
.hook-hd .ttl{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--text)}
.hook-hd .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.add-cmd{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  font-size:11.5px;color:var(--t3);border-radius:var(--r-cmd);
}
.add-cmd:hover{background:#141922;color:var(--t2)}

/* ================= 状态栏 ================= */
.statusbar{
  flex:0 0 34px;height:34px;display:flex;align-items:center;gap:16px;
  padding:0 24px;background:var(--bg);
  font-family:var(--mono);font-size:10.5px;color:var(--t3);
}
.statusbar .l{display:flex;align-items:center;gap:16px;min-width:0}
.statusbar .r{margin-left:auto;display:flex;align-items:center;gap:16px;flex:0 0 auto}
.statusbar .hl{color:var(--accent)}
.statusbar .wn{color:var(--amber)}
.statusbar .at{color:var(--text)}

/* ================= 抽屉 / 遮罩 ================= */
.backdrop{
  position:fixed;inset:0;background:rgba(6,9,13,.66);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.backdrop.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:520px;z-index:41;
  background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .22s cubic-bezier(.16,1,.3,1);
  display:flex;flex-direction:column;
}
.drawer.show{transform:translateX(0)}
.drawer-hd{
  flex:0 0 auto;display:flex;align-items:flex-start;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--line);
}
.drawer-hd .t{font-size:14px;font-weight:600;color:var(--text)}
.drawer-hd .s{font-family:var(--mono);font-size:10.5px;color:var(--t3);margin-top:4px}
.drawer-hd .x{margin-left:auto;color:var(--t3);padding:2px}
.drawer-hd .x:hover{color:var(--text)}
.drawer-bd{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:20px}
.drawer-ft{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:14px 20px;border-top:1px solid var(--line);
}
.drawer-ft .ok{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--accent)}
.drawer-ft .acts{margin-left:auto;display:flex;gap:10px}

/* ================= 执行监控页 ================= */
.run-head{
  display:flex;align-items:center;gap:14px;padding:18px 24px 14px;
}
.run-title{font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:10px}
.run-pct{margin-left:auto;display:flex;align-items:baseline;gap:14px}
.run-pct .v{font-family:var(--mono);font-size:30px;font-weight:500;color:var(--accent);line-height:1}
.run-pct .t{font-family:var(--mono);font-size:10.5px;color:var(--t3);text-align:right;line-height:1.7}
.bar{height:8px;border-radius:4px;background:var(--line);margin:0 24px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.nodes{display:flex;gap:18px;padding:16px 24px 18px;overflow-x:auto}
.node{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:0 0 auto}
.node .nm{font-family:var(--mono);font-size:11px;color:var(--t3)}
.node.done .nm{color:var(--t2)}
.node.run .nm{color:var(--cyan)}
.term{flex:1;display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line)}
.term-hd{
  flex:0 0 34px;height:34px;display:flex;align-items:center;gap:10px;
  padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);
}
.lights{display:flex;gap:6px}
.lights i{width:9px;height:9px;border-radius:50%;display:block}
.term-hd .ttl{font-family:var(--mono);font-size:11px;color:var(--t2)}
.term-hd .ttl b{color:var(--text);font-weight:500}
.term-hd .rt{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--accent)}
.term-bd{
  flex:1;overflow:auto;padding:14px 20px 20px;background:#080B10;
  font-family:var(--mono);font-size:11.5px;line-height:1.75;
}
/* 日志按终端语义保持对齐：不折行，超出时横向滚动 */
.ln{display:flex;gap:12px;white-space:pre;min-width:max-content}
.ln .ts{color:var(--t3);flex:0 0 auto}
.ln .lv{flex:0 0 62px}
.ln .lv.batch{color:var(--violet)}
.ln .lv.ssh{color:var(--cyan)}
.ln .lv.exec{color:var(--blue)}
.ln .lv.sftp{color:var(--cyan)}
.ln .lv.ok{color:var(--accent)}
.ln .lv.warn{color:var(--red)}
.ln .msg{color:var(--t2);flex:1;min-width:0}
.ln .msg b{color:var(--accent);font-weight:500}
.ln .msg i{color:var(--text);font-style:normal}
.ln .ok{color:var(--accent);font-weight:500}

/* ================= 空间卡片 ================= */
.space-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.space-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.space-card:hover{border-color:var(--line2);background:#141922}
.space-card.cur{border-color:rgba(0,224,122,.35)}
.space-card.arch{opacity:.55}
.space-card .top{display:flex;align-items:center;gap:10px}
.space-card .nm{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--text)}
.space-card.arch .nm{color:var(--t2);text-decoration:line-through}
.space-card .top .right{margin-left:auto}
.space-card .meta{font-size:11.5px;color:var(--t3)}
.space-card .path{
  font-family:var(--mono);font-size:10.5px;color:var(--t3);
  padding-top:10px;border-top:1px solid var(--line);
}
.space-card .foot{font-family:var(--mono);font-size:10.5px;color:var(--t3);display:flex;justify-content:space-between}

/* 空间切换下拉 */
.space-menu{
  position:absolute;top:42px;left:0;width:302px;z-index:60;
  background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-card);
  padding:8px;display:none;
}
.space-menu.show{display:block}
.space-menu .sw-search{
  display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:6px;
  background:#0F141B;border:1px solid var(--line);border-radius:var(--r-cmd);
}
.space-menu .sw-search svg{width:12px;height:12px;stroke:var(--t3)}
.space-menu .sw-search input{flex:1;background:none;border:none;font-size:11.5px;color:var(--text)}
.space-menu .it{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:var(--r-cmd);
  text-align:left;font-size:12.5px;
}
.space-menu .it:hover{background:#141922}
.space-menu .it .nm{font-family:var(--mono);flex:1;color:var(--text)}
.space-menu .it .mt{font-family:var(--mono);font-size:10px;color:var(--t3)}
.space-menu .it.arch .nm{color:var(--t3)}
.space-menu .ft{
  display:flex;gap:16px;padding:9px 9px 4px;margin-top:6px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--t2);
}
.space-menu .ft button:hover{color:var(--accent)}

/* ================= 批次详情 ================= */
.node-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.node-card{
  display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-btn);
}
.node-card .nm{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text)}
.node-card .host{font-family:var(--mono);font-size:11px;color:var(--t3);width:140px}
.node-card .du{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--t2)}
.node-card .du.slow{color:var(--text)}

.stage-row{display:flex;align-items:center;gap:10px;height:20px}
.stage-row .nm{font-family:var(--mono);font-size:11.5px;color:var(--t2);flex:0 0 132px}
.stage-row .nm.cn{font-family:var(--ui)}
.stage-row .nm.hot{color:var(--text);font-weight:500}
.stage-row .track{flex:1;height:6px;border-radius:3px;background:var(--line);position:relative}
.stage-row .track i{position:absolute;left:0;top:0;height:6px;border-radius:3px;display:block}
.stage-row .du{font-family:var(--mono);font-size:11.5px;color:var(--t2);flex:0 0 52px;text-align:right}
.stage-row .du.hot{color:var(--amber);font-weight:500}
.foot-note{font-size:10.5px;color:var(--t3);line-height:1.6}

.hook-row{display:flex;align-items:center;gap:10px;height:22px}
.hook-row svg{width:11px;height:11px;flex:0 0 11px}
.hook-row .nm{flex:1;min-width:0;font-size:11.5px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hook-row .du{font-family:var(--mono);font-size:11px;color:var(--t3);flex:0 0 52px;text-align:right}
.grp-lbl{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--t3)}

/* ================= 两列布局 ================= */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:0;flex:1;min-height:0}
.cols > .L{padding:18px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:22px}
.cols > .R{border-left:1px solid var(--line);padding:18px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}

/* ================= Toast ================= */
.toast{
  position:fixed;left:50%;bottom:52px;transform:translate(-50%,8px);
  padding:9px 18px;border-radius:var(--r-btn);z-index:200;
  background:var(--card);border:1px solid var(--line2);
  font-size:12px;color:var(--text);box-shadow:0 8px 28px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:rgba(0,224,122,.35)}
.toast.ok::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:9px;vertical-align:middle}

/* ================= 响应式收敛 =================
   三档降级：
   L ≤1360  压缩留白，表格隐藏 1 级次要列（.c-opt）
   M ≤1200  侧栏折叠为 56px 图标条，筛选器下沉到页面下拉
   S ≤1024  左右栏纵向堆叠，表格降级为横向滚动 + 首列吸附
   ============================================ */

/* ---------- L 档：≤1360 ---------- */
@media (max-width:1360px){
  .cols{grid-template-columns:minmax(0,1fr) 420px}
  .search{width:190px}
  .tbl-head,.tbl-row{grid-template-columns:var(--cols-l,var(--cols,1fr))}
  .tbl .c-opt{display:none}
  .metric{padding-right:38px}
  .metric + .metric{padding-left:22px}
}

/* ---------- M 档：≤1200 ---------- */
@media (max-width:1200px){
  .side{flex-basis:56px;width:56px;padding:14px 7px;gap:14px;align-items:center;overflow-x:hidden}
  .nav-group{width:100%}
  .nav-label,.side-file{display:none}
  .nav-group--filter{display:none}
  .nav-item .nm,.nav-item .ct{display:none}
  .nav-item .ic{display:block;width:14px;height:14px;flex:0 0 14px;color:var(--t2)}
  .nav-item.is-active .ic{color:var(--accent)}
  .nav-item{width:42px;justify-content:center;padding:9px 0;margin:0 auto}
  .grp-sel{display:flex}
  .page{padding:16px 18px}
  .metrics{margin:0 -18px;padding:0 18px;overflow-x:auto}
  .metric{flex:0 0 auto;padding-right:26px}
  .metric + .metric{padding-left:16px}
  .brand-ver{display:none}
  .nodes{padding:14px 18px 16px}
  .space-grid{grid-template-columns:1fr}
}

/* ---------- S 档：≤1024 ---------- */
@media (max-width:1024px){
  .cols{grid-template-columns:1fr}
  .cols > .R{border-left:none;border-top:1px solid var(--line)}
  .node-grid{grid-template-columns:1fr}
  .drawer{width:100%}
  /* 表格不转卡片流：运维场景需要横向对比状态，改为横向滚动 + 首列吸附 */
  .panel{overflow-x:auto}
  .tbl{min-width:var(--minw,660px)}
  .tbl-head > span:first-child,.tbl-row > .cell:first-child{
    position:sticky;left:0;z-index:2;background:var(--card);
  }
  .tbl-row:hover > .cell:first-child{background:#141922}
  /* 内联网格给的是桌面列宽，窄屏必须堆叠为单列 */
  .g2{grid-template-columns:1fr !important}
  .term{min-height:280px}
  .page.full{overflow:auto}
  .run-head{padding:16px 18px}
  .search{width:150px}
  /* 类型筛选为次要操作，窄屏让位给搜索与分组下拉 */
  .ph-right [data-act="type-filter"]{display:none}
}
</style>
</head>
<body>

<div class="shell">
  <header class="topbar" id="topbar"></header>
  <div class="topbar-sep"></div>
  <div class="main">
    <aside class="side" id="side"></aside>
    <div class="side-sep" id="sideSep"></div>
    <div class="col">
      <div class="content" id="content"></div>
      <div class="statusbar" id="statusbar"></div>
    </div>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ============================================================
   图标（内联 SVG，避免任何图标字体/外部依赖）
   ============================================================ */
const ICON = {
  logo: `<svg viewBox="0 0 14 14" fill="none"><path d="M7 11V3.2M7 3.2L3.6 6.6M7 3.2l3.4 3.4" stroke="#00E07A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.4 11.6h9.2" stroke="#00E07A" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  search: `<svg viewBox="0 0 14 14" fill="none"><circle cx="6.2" cy="6.2" r="4.2" stroke-width="1.5"/><path d="M9.4 9.4L12.4 12.4" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  link: `<svg viewBox="0 0 12 12" fill="none"><path d="M5 7a2 2 0 0 0 2.8 0l1.6-1.6a2 2 0 1 0-2.8-2.8l-.7.7" stroke-width="1.3" stroke-linecap="round"/><path d="M7 5a2 2 0 0 0-2.8 0L2.6 6.6a2 2 0 1 0 2.8 2.8l.7-.7" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  trash: `<svg viewBox="0 0 12 12" fill="none"><path d="M2 3.4h8M4.6 3.4V2.2h2.8v1.2M3.2 3.4l.4 6.4h5.2l.4-6.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  plus: `<svg viewBox="0 0 12 12" fill="none"><path d="M6 2.4v7.2M2.4 6h7.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  bolt: `<svg viewBox="0 0 12 12" fill="none"><path d="M6.8 1.2L2.6 6.8h3l-.8 4 4.2-5.6h-3l.8-4z" fill="currentColor"/></svg>`,
  play: `<svg viewBox="0 0 12 12" fill="none"><path d="M3.4 2.2l6 3.8-6 3.8V2.2z" fill="currentColor"/></svg>`,
  check: `<svg viewBox="0 0 11 11" fill="none"><path d="M1.6 5.9L4.3 8.6L9.4 2.6" stroke="#00E07A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  close: `<svg viewBox="0 0 12 12" fill="none"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  grip: `<svg viewBox="0 0 12 12" fill="none"><path d="M3.4 4.6h5.2M3.4 7.4h5.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
  /* 侧栏折叠为图标条时使用的导航图标 */
  server: `<svg viewBox="0 0 14 14" fill="none"><rect x="1.6" y="2.2" width="10.8" height="4.2" rx="1.2" stroke="currentColor" stroke-width="1.3"/><rect x="1.6" y="7.6" width="10.8" height="4.2" rx="1.2" stroke="currentColor" stroke-width="1.3"/><path d="M9.9 4.3h.01M9.9 9.7h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  key: `<svg viewBox="0 0 14 14" fill="none"><circle cx="4.4" cy="9.6" r="2.8" stroke="currentColor" stroke-width="1.3"/><path d="M6.4 7.6l5-5M9.6 4.4l1.6 1.6M8.2 5.8l1.6 1.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  hook: `<svg viewBox="0 0 14 14" fill="none"><path d="M7 2.4v4.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7 6.6a3 3 0 1 0 3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M2.6 3.2h8.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  clock: `<svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.3"/><path d="M7 4.2V7l2.2 1.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  gear: `<svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="2.1" stroke="currentColor" stroke-width="1.3"/><path d="M7 1.6v1.6M7 10.8v1.6M1.6 7h1.6M10.8 7h1.6M3.2 3.2l1.1 1.1M9.7 9.7l1.1 1.1M10.8 3.2L9.7 4.3M4.3 9.7L3.2 10.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  layers: `<svg viewBox="0 0 14 14" fill="none"><path d="M7 1.8L12.2 4.6 7 7.4 1.8 4.6 7 1.8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M1.8 8l5.2 2.8L12.2 8" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>`
};

/* ============================================================
   API 客户端 —— 后端 REST 契约统一封装（单一出口，便于统一错误处理）
   ============================================================ */
const API = {
  qs(params) {
    const p = new URLSearchParams();
    for (const k in params) {
      const v = params[k];
      if (v !== undefined && v !== null && v !== '') p.set(k, v);
    }
    const s = p.toString();
    return s ? '?' + s : '';
  },
  async req(method, url, body) {
    const opt = { method, headers: {} };
    if (body !== undefined) {
      opt.headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(body);
    }
    let res;
    try { res = await fetch(url, opt); }
    catch (e) { throw new Error('无法连接控制台后端'); }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
    if (!res.ok) {
      const err = new Error(data && data.error ? data.error : (text || ('HTTP ' + res.status)));
      err.status = res.status;
      throw err;
    }
    return data;
  },
  config: ws => API.req('GET', '/api/config' + API.qs({ workspace: ws })),
  saveConfig: (cfg, ws) => API.req('POST', '/api/config' + API.qs({ workspace: ws }), cfg),
  workspaces: () => API.req('GET', '/api/workspaces'),
  selectWorkspace: id => API.req('POST', '/api/workspaces/select', { workspace: id }),
  createWorkspace: (id, name, from) => API.req('POST', '/api/workspaces/create', { id, name, from }),
  deleteWorkspace: id => API.req('DELETE', '/api/workspaces?id=' + encodeURIComponent(id)),
  deploy: opts => API.req('POST', '/api/deploy', opts),
  cancel: () => API.req('POST', '/api/deploy/cancel', {}),
  testConnect: (serviceName, server) => API.req('POST', '/api/server/test-connect', { serviceName, server }),
  pickPath: mode => API.req('GET', '/api/system/pick-path' + API.qs({ mode })),
  history: (ws, limit) => API.req('GET', '/api/deploy/history' + API.qs({ workspace: ws, limit })),
  batch: (id, ws) => API.req('GET', '/api/deploy/history/' + encodeURIComponent(id) + API.qs({ workspace: ws })),
  keys: ws => API.req('GET', '/api/keys' + API.qs({ workspace: ws })),
  importKey: (name, content, passphrase, ws) => API.req('POST', '/api/keys' + API.qs({ workspace: ws }), { name, content, passphrase }),
  deleteKey: (name, ws) => API.req('DELETE', '/api/keys' + API.qs({ id: name, workspace: ws })),
  settings: () => API.req('GET', '/api/settings'),
  saveSettings: st => API.req('POST', '/api/settings', st)
};

/* ============================================================
   全局状态 —— 单一数据源：视图只读 state，动作经 API 写回后置 dirty
   ============================================================ */
const state = {
  ready: false,          // 后端引导（workspaces + config）是否完成
  config: null,          // 当前活动空间的 deploy.json（脱敏视图；保存时原样回传，后端回填掩码真值）
  workspaces: [],
  activeWs: '',
  dirty: false,          // 相对磁盘 deploy.json 的未保存更改
  deploy: null,          // 实时批次状态（由 SSE 结构化事件驱动）
  logBuffer: [],         // 日志环形缓冲（重渲染时回填终端）
  logCount: 0,
  es: null,              // EventSource
  esConnected: false,
  history: [],
  historyLoaded: false,
  batch: null,           // 批次详情
  batchId: null,
  keys: [],
  keysLoaded: false,
  settings: null,
  settingsLoaded: false
};

/* 未保存更改标记：任何就地编辑（服务表单/主机抽屉/钩子/排除规则）都必须先经过它 */
function markDirty() {
  state.dirty = true;
  const btn = document.querySelector('#topbar [data-act="save"]');
  if (btn && !btn.textContent.includes('●')) btn.textContent = btn.textContent + ' ●';
}

/* ============================================================
   派生模型 —— 主机由 services[].server 按 host:port@user 去重派生
   （后端无独立主机库 schema，保持 deploy.json 结构不变）
   ============================================================ */
const GROUP_NAME = { infra:'基础设施', backend:'后端服务', frontend:'前端资源', data:'数据任务', default:'默认分组' };

function cfgServices() { return (state.config && state.config.services) || []; }
function cfgScenarios() { return (state.config && state.config.scenarios) || []; }
function cfgGroups() {
  const counts = {};
  for (const s of cfgServices()) {
    const g = (s.group || 'default').toLowerCase();
    counts[g] = (counts[g] || 0) + 1;
  }
  return counts;
}
function groupName(k) { return GROUP_NAME[(k || '').toLowerCase()] || (k || 'default'); }

function svcStage(svc) { return 'S' + String(svc.stage || 1).padStart(2, '0'); }
function svcSt(svc) { return svc.enabled === false ? 'off' : 'ok'; }

/* 场景覆盖的服务数：按场景的 groups/services/types 过滤口径统计 */
function scenarioServices(sc) {
  const gs = (sc.groups || []).map(x => x.toLowerCase());
  const ss = (sc.services || []).map(x => x.toLowerCase());
  const ts = (sc.types || []).map(x => x.toLowerCase());
  return cfgServices().filter(s => {
    if (s.enabled === false) return false;
    const g = (s.group || 'default').toLowerCase();
    const n = (s.name || '').toLowerCase();
    const t = (s.type || 'standard').toLowerCase();
    if (gs.length && !gs.includes(g)) return false;
    if (ss.length && !ss.includes(n)) return false;
    if (ts.length && !ts.includes(t)) return false;
    return true;
  });
}

function deriveHosts() {
  const map = new Map();
  for (const s of cfgServices()) {
    const sv = s.server || {};
    const key = (sv.host || '') + ':' + (sv.port || 22) + '@' + (sv.username || '');
    if (!key || key === ':22@') continue;
    if (!map.has(key)) {
      map.set(key, {
        key, host: sv.host || '', port: sv.port || 22, user: sv.username || '',
        auth: sv.password ? '密码' : (sv.privateKeyPath ? '密钥' + (sv.hostKeyFingerprint ? ' + 指纹' : '') : '—'),
        refs: [], services: []
      });
    }
    const h = map.get(key);
    h.services.push(s);
    h.refs.push(s.name);
  }
  return [...map.values()];
}

/* ============================================================
   格式化工具 —— 耗时/时间统一由毫秒计算（契约修正：不再硬编码人读字符串）
   ============================================================ */
function fmtMs(ms) {
  if (ms == null || isNaN(ms)) return '—';
  if (ms < 1000) return ms + 'ms';
  const s = ms / 1000;
  if (s < 60) return (Math.round(s * 10) / 10) + 's';
  const m = Math.floor(s / 60);
  const rs = Math.round(s - m * 60);
  return m + 'm' + String(rs).padStart(2, '0') + 's';
}
function fmtClock(ts) {
  const d = ts instanceof Date ? ts : new Date(ts);
  if (isNaN(d.getTime())) return '—';
  const p = n => String(n).padStart(2, '0');
  return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fmtDateTime(ts) {
  const d = ts instanceof Date ? ts : new Date(ts);
  if (isNaN(d.getTime())) return '—';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

/* ============================================================
   路由
   ============================================================ */
const app = {
  view:'orchestration', arg:null,
  scenario:null, group:null,
  typeFilter:'全部类型', search:''
};

function parseHash(){
  const raw = (location.hash || '#/orchestration').replace(/^#\/?/,'');
  const p = raw.split('/').filter(Boolean);
  return { view:p[0] || 'orchestration', arg:p[1] ? decodeURIComponent(p[1]) : null };
}
function go(hash){
  if (location.hash === hash) { route(); } else { location.hash = hash; }
}

/* ============================================================
   工具
   ============================================================ */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function dotOf(st){
  return st === 'ok' ? 'ok' : st === 'warn' ? 'warn' : st === 'err' ? 'err' : 'muted';
}
function stLabel(st){
  return st === 'ok' ? '就绪' : st === 'warn' ? '变更待保存' : st === 'err' ? '失败' : st === 'off' ? '已停用' : '未引用';
}
function stClass(st){
  return st === 'ok' ? 'ok' : st === 'warn' ? 'warn' : st === 'err' ? 'err' : 'dim';
}
let toastTimer = null;
function toast(msg, kind){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind === 'ok' ? ' ok' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 2200);
}

}
function crumb(parts){
  return `<div class="crumb">` + parts.map((p,i)=>{
    const last = i === parts.length - 1;
    let seg = last
      ? `<span class="cur">${esc(p.t)}</span>`
      : `<span class="up${p.go ? ' link' : ''}"${p.go ? ` data-go="${esc(p.go)}"` : ''}>${esc(p.t)}</span>`;
    if (i > 0) seg = `<span class="sep">/</span>` + seg;
    return seg;
  }).join('') + `</div>`;
}

function renderSide(){

    side.style.display = 'none'; sep.style.display = 'none';

  }
  side.style.display = ''; sep.style.display = '';

  const sysActive = { hooks:'hooks', history:'history', batch:'history', settings:'settings', keys:'keys', spaces:'spaces' }[app.view] || '';
  const mainActive = ['orchestration','service'].includes(app.view);
  const groups = cfgGroups();

  /* cls='filter' 的分组是筛选器而非导航，侧栏折叠为图标条时隐藏，
     由页面内的下拉控件承接（见 .grp-sel） */
  const nav = (label, items, cls) => `<div class="nav-group${cls ? ' nav-group--' + cls : ''}">
    <div class="nav-label">${label}</div>
    ${items.join('')}
  </div>`;

  const item = (t, c, active, attrs, icon) =>
    `<button class="nav-item${active ? ' is-active' : ''}" title="${esc(t)}${c != null ? '（' + c + '）' : ''}" ${attrs || ''}>
      ${icon ? `<span class="ic">${icon}</span>` : ''}
      <span class="nm">${esc(t)}</span>${c != null ? `<span class="ct">${c}</span>` : ''}
    </button>`;

  side.innerHTML =
    nav('场景 / SCENARIOS', cfgScenarios().map(sc =>
      item(sc.name || sc.description || '', scenarioServices(sc).length,
        mainActive && app.scenario === sc.name, `data-scenario="${esc(sc.name)}"`)), 'filter') +
    nav('分组 / GROUPS', Object.keys(groups).map(k =>
      item(groupName(k), groups[k],
        mainActive && app.group === k, `data-group="${esc(k)}"`)), 'filter') +
    nav('主机 / HOSTS', [
      item('主机配置库', ((state.config && state.config.hosts) || []).length + deriveHosts().length, app.view === 'hosts', `data-go="#/hosts"`, ICON.server),
      item('SSH 密钥', state.keysLoaded ? state.keys.length : null, app.view === 'keys', `data-go="#/keys"`, ICON.key)
    ]) +
    `<div class="nav-spacer"></div>` +
    nav('系统 / SYSTEM', [
      item('空间管理', state.workspaces.length, sysActive === 'spaces', `data-go="#/spaces"`, ICON.layers),
      item('批次钩子', null, sysActive === 'hooks', `data-go="#/hooks"`, ICON.hook),
      item('部署历史', null, sysActive === 'history', `data-go="#/history"`, ICON.clock),
      item('设置', null, sysActive === 'settings', `data-go="#/settings"`, ICON.gear)
    ]) +
    `<div class="side-file">
      <div class="p">deploy.json</div>
      <div class="s">空间 ${esc(state.activeWs)}${state.dirty ? ' · 有未保存更改' : ''}</div>
    </div>`;

  side.querySelectorAll('[data-go]').forEach(el => el.onclick = () => go(el.dataset.go));
  side.querySelectorAll('[data-scenario]').forEach(el => el.onclick = () => {
    const k = el.dataset.scenario;
    app.scenario = app.scenario === k ? null : k;
    app.group = null;
    go('#/orchestration');
  });
  side.querySelectorAll('[data-group]').forEach(el => el.onclick = () => {
    const k = el.dataset.group;
    app.group = app.group === k ? null : k;
    app.scenario = null;
    go('#/orchestration');
  });
}

  const addr = (state.settings && state.settings.listenAddr) || '127.0.0.1:8080';

  if (v === 'orchestration') {
    const enabled = cfgServices().filter(s => s.enabled !== false).length;
    L = `<span class="hl">READY ${enabled}/${cfgServices().length}</span><span>${esc(addr)}</span>`;
    R = `<span>Go · CGO_ENABLED=0</span><span>空间 ${esc(state.activeWs)}</span>`;

      : `<span class="hl">${state.deploy ? state.deploy.status.toUpperCase() : 'IDLE'}</span><span>${esc(addr)}</span>`;

    R = `<span>切换空间时重新加载对应 deploy.json</span><span>workspaces/&lt;空间&gt;.json</span>`;
  } else if (v === 'service') {
    L = `<span>SERVICE</span><span class="hl">${esc(app.arg || '')}</span>`;

  } else if (v === 'hooks') {
    const hooks = (state.config && state.config.hooks) || {};
    const cnt = (hooks.preDeploy || []).length + (hooks.postDeploy || []).length;
    L = `<span>SCOPE</span><span class="at">batch</span><span>2 个钩子 · ${cnt} 条命令</span><span>deploy.json</span>`;
    R = `<span>保存后对全部场景生效</span><span>hooks.preDeploy / hooks.postDeploy</span>`;
  } else if (v === 'batch') {
    const rec = state.batch;
    L = rec
      ? `<span class="hl">BATCH #${esc(rec.id)}</span><span class="at">${rec.total} NODES · ${rec.failed} FAILED</span><span>${esc(rec.workspace || state.activeWs)}</span>`
      : `<span class="hl">BATCH #${esc(app.arg || '')}</span>`;
    R = rec ? `<span>${esc(rec.status)}</span><span>workspaces/${esc(rec.workspace || state.activeWs)}/history/batch-${esc(rec.id)}.log</span>` : '';
  } else if (v === 'history') {
    L = `<span class="hl">${state.history.length} BATCHES</span><span>空间 ${esc(state.activeWs)}</span>`;
    R = `<span>批次记录与日志归档于 workspaces/&lt;空间&gt;/history/</span>`;

    R = `<span>凭据以 ${'${ENV}'} 插值注入</span><span>settings.json</span>`;
  }
  sb.innerHTML = `<div class="l">${L}</div><div class="r">${R}</div>`;
}

/* ============================================================
   视图 —— 2. 执行监控（真实 SSE：文本日志 + 结构化批次事件）
   ============================================================ */
function viewExecution(){
  const d = state.deploy;
  const nodes = (d ? d.nodes : []).map(n => {
    const cls = n.s === 'done' ? 'done' : n.s === 'run' ? 'run' : n.s === 'err' ? 'done' : 'wait';
    const dot = n.s === 'done' ? 'ok' : n.s === 'run' ? 'run' : n.s === 'err' ? 'err' : 'muted';
    return `<div class="node ${cls}"><span class="dot dot--${dot}"></span><span class="nm">${esc(n.name)}</span></div>`;
  }).join('');

  const done = d ? d.done : 0;
  const total = d && d.total ? d.total : 0;
  const pct = total ? Math.round(done / total * 100) : (d && d.status === 'running' ? 0 : 0);
  const headTxt = !d ? '暂无进行中的部署'
    : d.status !== 'running' ? (d.status === 'success' ? '批次成功完成' : d.status === 'canceled' ? '批次已中止' : '批次失败')
    : `部署执行中 · ${d.id || ''}`;

  return `
  <div class="page full" style="display:flex;flex-direction:column">
    <div class="run-head">
      <div class="run-title"><span class="dot dot--${d ? (d.status === 'running' ? 'run' : d.status === 'success' ? 'ok' : 'err') : 'muted'}"></span>${esc(headTxt)}</div>
      <div class="run-pct">
        <span class="v" id="runPct">${total ? pct + '%' : '—'}</span>
        <span class="t">${d ? `节点 ${done}/${total}${d.failed ? ' · 失败 ' + d.failed : ''}` : '触发部署后此处展示实时进度'}</span>
      </div>
    </div>
    <div class="bar"><i id="runBar" style="width:${total ? pct : 0}%"></i></div>
    <div class="nodes" id="runNodes">${nodes || ''}</div>

    <div class="term">
      <div class="term-hd">
        <div class="lights"><i style="background:#FF5D5D"></i><i style="background:#FFB020"></i><i style="background:#00E07A"></i></div>

/* 日志行解析：清洗 ANSI 颜色码，按后端 TAG（DEPLOY/SUCCESS/ERROR/服务名）映射级别徽标 */
const ANSI_RE = /\x1b\[[0-9;]*m/g;
function parseLogLine(raw){
  const line = raw.replace(ANSI_RE, '');
  const m = line.match(/^\[(\d{2}:\d{2}:\d{2})\]\s+([\s\S]*)$/);
  if (!m) return { ts: '', lv: 'exec', msg: line };
  const t = m[2].match(/^\[([^\]]+)\]\s*([\s\S]*)$/);
  let lv = 'exec', msg = m[2];
  if (t) {
    const tag = t[1];
    msg = t[2];
    if (tag === 'DEPLOY' || tag === 'SYSTEM') lv = 'batch';
    else if (tag === 'SUCCESS') lv = 'ok';
    else if (tag === 'ERROR') lv = 'warn';
    else if (/sftp|上传|传输|续传/i.test(msg)) lv = 'sftp';
    else if (/ssh|连接|握手|登录/i.test(msg)) lv = 'ssh';
  }
  return { ts: m[1], lv, msg };
}

function logLineHTML(ts, lv, msg){
  const TAG = { batch:'[批次]', ssh:'[SSH]', exec:'[EXEC]', sftp:'[SFTP]', ok:'[ OK ]', warn:'[WARN]' };
  const html = esc(msg).replace(/\$ /g, '<i>$ </i>');
  return `<div class="ln"><span class="ts">${esc(ts)}</span><span class="lv ${lv}">${TAG[lv] || '[LOG]'}</span><span class="msg">${html}</span></div>`;
}

function appendLogLine(raw){
  if (!raw || raw.indexOf('[[') === 0) return;   // 哨兵标记不进终端
  const parsed = parseLogLine(raw);
  state.logBuffer.push(parsed);
  if (state.logBuffer.length > 2000) state.logBuffer.shift();
  state.logCount++;
  const bd = document.getElementById('termBd');
  if (bd) {
    bd.insertAdjacentHTML('beforeend', logLineHTML(parsed.ts, parsed.lv, parsed.msg));
    while (bd.children.length > 2000) bd.removeChild(bd.firstChild);
    bd.scrollTop = bd.scrollHeight;
  }
}

function refillLog(){
  const bd = document.getElementById('termBd');
  if (!bd) return;
  bd.innerHTML = state.logBuffer.map(l => logLineHTML(l.ts, l.lv, l.msg)).join('');
  bd.scrollTop = bd.scrollHeight;
}

/* ============================================================
   SSE 接入 —— EventSource 消费文本日志与结构化批次事件
   ============================================================ */
function ensureSSE(){
  if (state.es) return;
  const es = new EventSource('/api/deploy/events');
  state.es = es;
  es.onopen = () => { state.esConnected = true; renderStatus(); render(); };
  es.onerror = () => { state.esConnected = false; renderStatus(); };
  es.onmessage = ev => {
    const line = ev.data || '';
    if (line === '[[DEPLOY_COMPLETED_SUCCESS]]') return finishDeploy('success');
    if (line === '[[DEPLOY_COMPLETED_FAILED]]')  return finishDeploy('failed');
    if (line === '[[DEPLOY_CANCELED]]')          return finishDeploy('canceled');
    if (line.indexOf('[CONNECTED]') === 0) return;
    appendLogLine(line);
  };
  es.addEventListener('batch_started', ev => {
    const p = safeJSON(ev.data) || {};
    state.deploy = {
      id: p.id, workspace: p.workspace, scenario: p.scenario,
      total: p.total || (p.services ? p.services.length : 0),
      done: 0, ok: 0, failed: 0, status: 'running', curStage: null,
      nodes: (p.services || []).map(s => ({ name: s.name, host: s.host, group: s.group, s: 'wait' }))
    };
    state.logBuffer = []; state.logCount = 0;
    softRender();
  });
  es.addEventListener('service_started', ev => {
    const p = safeJSON(ev.data) || {};
    if (!state.deploy) return;
    const n = nodeByName(p.name);
    if (n) { n.s = 'run'; }
    state.deploy.curStage = p.stage;
    softRender();
  });
  es.addEventListener('service_finished', ev => {
    const p = safeJSON(ev.data) || {};
    if (!state.deploy) return;
    const n = nodeByName(p.name);
    if (n) {
      n.s = p.status === 'ok' ? 'done' : (p.status || 'err');
      n.dur = p.durationMs;
      n.err = p.error;
    }
    state.deploy.done++;
    if (p.status === 'ok') state.deploy.ok++; else state.deploy.failed++;
    softRender();
  });
  es.addEventListener('batch_finished', ev => {
    const rec = safeJSON(ev.data) || {};
    if (state.deploy && state.deploy.status === 'running') {
      state.deploy.status = rec.status === 'canceled' ? 'canceled' : rec.status === 'success' ? 'success' : 'failed';
      if (rec.total) state.deploy.done = rec.total;
    }
    state.historyLoaded = false;   // 批次落盘后刷新历史指标
    softRender();
  });
}

function safeJSON(s) { try { return JSON.parse(s); } catch (e) { return null; } }
function nodeByName(name) { return state.deploy ? state.deploy.nodes.find(n => n.name === name) : null; }

function finishDeploy(kind){
  if (state.deploy && state.deploy.status === 'running') state.deploy.status = kind;
  toast(kind === 'success' ? '部署批次成功完成' : kind === 'canceled' ? '部署已被中止' : '部署批次失败', kind === 'success' ? 'ok' : undefined);
  softRender();
}

/* 渲染节流：高频事件下合并到下一帧；后台标签页 rAF 被节流时以 setTimeout 兜底 */
let renderQueued = false;
function softRender(){
  if (renderQueued) return;
  renderQueued = true;
  const run = () => {
    if (!renderQueued) return;
    renderQueued = false;
    if (app.view === 'execution') { updateExecDynamic(); renderStatus(); renderTopbar(); }
    else render();
  };
  requestAnimationFrame(run);
  setTimeout(run, 300);
}

/* 服务配置页保存：从表单收集并写回 config.services 条目 */
function applyServiceForm(){
  const d = currentService();
  if (!d) return;
  const val = id => { const el = document.getElementById(id); return el ? el.value : null; };
  const num = (v, def) => { const n = parseInt(v, 10); return isNaN(n) ? def : n; };

  d.name = (val('fName') || d.name).trim();
  d.group = (val('fGroup') || 'default').trim();
  const typeEl = document.querySelector('#fType button.on');
  if (typeEl) d.type = typeEl.dataset.svcType;
  d.stage = num(val('fStage'), d.stage || 1);
  const enEl = document.querySelector('#fEnabled button.on');
  if (enEl) d.enabled = enEl.dataset.on === '1' ? true : (enEl.dataset.on === '0' ? false : undefined);
  const hostRef = (val('fHostRef') || '').trim();
  if (hostRef) { d.hostRef = hostRef; } else { delete d.hostRef; }

  d.server = d.server || {};
  d.server.host = (val('fHost') || '').trim();
  d.server.port = num(val('fPort'), 22);
  d.server.username = (val('fUsername') || '').trim();
  // 掩码或留空保持原值，由后端 MergePreservingSecrets 语义保证不覆盖真实凭证
  const pwd = val('fPassword');
  if (pwd && pwd !== '******') d.server.password = pwd;
  const pp = val('fPassphrase');
  if (pp && pp !== '******') d.server.passphrase = pp;
  d.server.privateKeyPath = (val('fKeyPath') || '').trim();
  d.server.hostKeyFingerprint = (val('fFingerprint') || '').trim();
  d.server.connectTimeout = num(val('fTimeout'), 15);

  d.upload = d.upload || {};
  d.upload.localPath = (val('fLocalPath') || '').trim();
  d.upload.remotePath = (val('fRemotePath') || '').trim();
}

function viewHistory(){

  const rows = state.history.map(h => `
    <div class="tbl-row is-click" data-batch="${esc(h.id)}">
      <div class="cell"><span class="val">${esc(fmtClock(h.start))}</span></div>
      <div class="cell"><span class="nm">${esc(h.workspace || state.activeWs)}</span></div>
      <div class="cell"><span class="val">批次 #${esc(h.id)}${h.scenario ? ' · ' + esc(h.scenario) : ''} · ${h.total} 节点 · 成功 ${h.success}</span></div>
      <div class="cell right"><span class="st ${h.status === 'success' ? 'ok' : 'err'}" style="margin-left:auto">

        <div class="ph-title">部署历史</div>

      <div class="metric"><span class="k">FAILED</span><span class="v${failed ? ' r' : ''}">${failed}</span></div>

/* ============================================================
   视图 —— 9. 批次详情（GET /api/deploy/history/{id}）
   ============================================================ */
function viewBatch(){
  const bid = app.arg;
  if (!state.batch || state.batchId !== bid) {
    loadBatch(bid).then(render);
    return loadingPanel('批次 #' + bid);
  }
  const rec = state.batch;
  const ok = rec.status === 'success';
  const slowest = rec.services.reduce((m, s) => (s.durationMs || 0) > (m ? m.durationMs : -1) ? s : m, null);

  /* 波次耗时聚合：由节点结果按 stage 汇总（后端按 Stage 分波调度） */
  const stageAgg = {};
  for (const s of rec.services) {
    const st = 'S' + String(s.stage || 1).padStart(2, '0');
    stageAgg[st] = (stageAgg[st] || 0) + (s.durationMs || 0);
  }
  const maxStage = Math.max(1, ...Object.values(stageAgg));
  const stageRows = Object.keys(stageAgg).map(st => `
    <div class="stage-row">
      <span class="nm">${esc(st)}</span>
      <span class="track"><i style="width:${(stageAgg[st] / maxStage * 100).toFixed(1)}%;background:var(--cyan)"></i></span>
      <span class="du">${esc(fmtMs(stageAgg[st]))}</span>
    </div>`).join('');

  const nodeCards = rec.services.map(s => `
    <div class="node-card">
      <span class="dot dot--${s.status === 'ok' ? 'ok' : s.status === 'skipped' ? 'muted' : 'err'}"></span>
      <span class="nm">${esc(s.name)}</span>
      <span class="host">${esc(s.host || '')}</span>
      <span class="du" title="${esc(s.error || '')}">${s.status === 'ok' ? esc(fmtMs(s.durationMs)) : s.status === 'skipped' ? '跳过' : esc((s.error || '失败').slice(0, 40))}</span>
    </div>`).join('');

  const failedNodes = rec.services.filter(s => s.status !== 'ok' && s.status !== 'skipped');

  return `
  <div class="page">
    <div class="page-head">
      <div>
        <div class="h1" style="display:flex;align-items:center;gap:10px">批次 #${esc(rec.id)}
          ${ok
            ? `<span class="pill pill--ok"><span class="dot dot--ok"></span>SUCCESS</span>`
            : rec.status === 'canceled'
              ? `<span class="pill pill--warn"><span class="dot dot--warn"></span>CANCELED</span>`
              : `<span class="pill pill--err"><span class="dot dot--err"></span>FAILED</span>`}</div>
        <div class="ph-sub mono">${esc(rec.workspace || state.activeWs)}${rec.scenario ? ' · ' + esc(rec.scenario) : ''} · ${esc(fmtDateTime(rec.start))} → ${esc(fmtDateTime(rec.end))} · 耗时 ${esc(fmtMs(rec.durationMs))}</div>
      </div>
      <div class="ph-right" style="padding-top:6px"><button class="btn" data-act="compare">与上批次对比</button></div>
    </div>

    <div class="metrics">
      <div class="metric"><span class="k">NODES</span><span class="v">${rec.total}</span></div>
      <div class="metric"><span class="k">SUCCESS</span><span class="v g">${rec.success}</span></div>
      <div class="metric"><span class="k">FAILED</span><span class="v${rec.failed ? ' r' : ''}">${rec.failed}</span></div>
      <div class="metric"><span class="k">DURATION</span><span class="v">${esc(fmtMs(rec.durationMs))}</span></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:13px;font-weight:600;color:var(--text)">节点执行结果</span>
        <span style="font-size:11px;color:var(--t3)">${ok
          ? `${rec.total} 个节点全部成功${slowest ? ` · 最慢节点 ${esc(slowest.name)} ${esc(fmtMs(slowest.durationMs))}` : ''}`
          : `${rec.total} 个节点调度 · ${rec.failed} 个节点失败`}</span>
      </div>
      <div class="node-grid" style="flex:1">${nodeCards}</div>
    </div>

    <div class="g2" style="display:grid;grid-template-columns:660px minmax(0,1fr);gap:12px">
      <div class="panel" style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;flex-direction:column;gap:5px">
          <span style="font-size:13px;font-weight:600;color:var(--text)">波次耗时聚合</span>
          <span style="font-size:11px;color:var(--t3)">按 Stage 分波调度 · 波次串行 · 波内按 Worker Pool 并发</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">${stageRows || '<span class="dim" style="font-size:11px">无节点数据</span>'}</div>
        <div style="flex:1"></div>
        <div class="foot-note">数据来源 workspaces/${esc(rec.workspace || state.activeWs)}/history/batch-${esc(rec.id)}.json</div>
      </div>

      <div class="panel" style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;flex-direction:column;gap:5px">
          <span style="font-size:13px;font-weight:600;color:var(--text)">失败明细</span>
          <span style="font-size:11px;color:var(--t3)">${failedNodes.length ? failedNodes.length + ' 个节点存在失败原因记录' : '本批次无失败节点'}</span>
        </div>
        ${failedNodes.map(s => `
          <div style="display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-radius:var(--r-cmd);background:rgba(255,93,93,.06);border:1px solid rgba(255,93,93,.18)">
            <span class="mono" style="font-size:11.5px;color:var(--red)">${esc(s.name)} · ${esc(s.host || '')}</span>
            <span style="font-size:10.5px;color:var(--t2);line-height:1.5;word-break:break-all">${esc(s.error || '未知错误')}</span>
          </div>`).join('') || '<span class="dim" style="font-size:11px">全部节点流水线执行成功，无中断</span>'}
        <div style="flex:1"></div>
        <div class="foot-note">完整日志归档于 workspaces/${esc(rec.workspace || state.activeWs)}/history/batch-${esc(rec.id)}.log</div>
      </div>
    </div>
  </div>`;
}

  try {
    state.batch = await API.batch(id, state.activeWs);
    state.batchId = id;

    state.batch = null; state.batchId = null;

/* 导出批次报告：由详情数据本地生成 JSON 下载 */
function exportBatchReport(){
  const rec = state.batch;
  if (!rec) { toast('请先打开批次详情'); return; }
  downloadJSON(rec, 'batch-' + rec.id + '.json');
}
function exportAllHistory(){
  if (!state.history.length) { toast('暂无历史记录可导出'); return; }
  downloadJSON(state.history, 'deploy-history-' + state.activeWs + '.json');
}
function downloadJSON(data, filename){
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* 与上批次对比：取历史列表中紧邻的上一条做摘要 diff */
function compareWithPrev(){
  const cur = state.batch;
  if (!cur) { toast('请先打开批次详情'); return; }
  const idx = state.history.findIndex(h => h.id === cur.id);
  const prev = idx >= 0 && idx + 1 < state.history.length ? state.history[idx + 1] : null;
  if (!prev) { toast('没有更早的批次可对比'); return; }
  const dDur = (cur.durationMs || 0) - (prev.durationMs || 0);
  const dNodes = (cur.total || 0) - (prev.total || 0);
  toast(`对比批次 #${prev.id}：耗时 ${dDur >= 0 ? '+' : ''}${fmtMs(Math.abs(dDur))} · 节点 ${dNodes >= 0 ? '+' : ''}${dNodes}`);
}

/* 从抽屉收集当前表单值为 ServerConfig（用于连通性测试与回写） */
function collectDrawerServer(){
  const val = id => { const el = document.getElementById(id); return el ? el.value : null; };
  const num = (v, def) => { const n = parseInt(v, 10); return isNaN(n) ? def : n; };
  const server = {
    host: (val('dHost') || '').trim(),
    port: num(val('dPort'), 22),
    username: (val('dUser') || '').trim(),
    privateKeyPath: (val('dKeyPath') || '').trim(),
    hostKeyFingerprint: (val('dFingerprint') || '').trim(),
    connectTimeout: num(val('dTimeout'), 15)
  };
  const pwd = val('dPassword');
  if (pwd && pwd !== '******') server.password = pwd;
  const pp = val('dPassphrase');
  if (pp && pp !== '******') server.passphrase = pp;
  return server;
}

/* 抽屉内容为动态注入，打开后需单独绑定其动作按钮（bind() 仅覆盖渲染时就存在的 DOM） */
function bindDrawerActions(){
  document.getElementById('drawer').querySelectorAll('[data-act]').forEach(el => {
    const fn = ACTIONS[el.dataset.act];
    if (fn) el.onclick = fn;
  });
}

/* 保存抽屉：library 模式写回 hosts[] 条目；inline 模式同步回写全部引用服务 */
function applyDrawer(){
  if (!drawerCtx) return false;
  const server = collectDrawerServer();
  const num = (v, def) => { const n = parseInt(v, 10); return isNaN(n) ? def : n; };

  if (drawerCtx.mode === 'library') {
    const lib = state.config.hosts || (state.config.hosts = []);
    const h = lib.find(x => x.name === drawerCtx.name);
    if (!h) return false;
    const keepPwd = h.server ? h.server.password : '';
    const keepPP = h.server ? h.server.passphrase : '';
    const nameInput = document.getElementById('dName');
    h.name = (nameInput && nameInput.value.trim()) || h.name;
    h.server = h.server || {};
    h.server.host = server.host;
    h.server.port = server.port;
    h.server.username = server.username;
    // 密码/口令留空或掩码时保持原值（掩码由后端 MergePreservingSecrets 兜底）
    h.server.password = server.password !== undefined ? server.password : keepPwd;
    h.server.passphrase = server.passphrase !== undefined ? server.passphrase : keepPP;
    h.server.privateKeyPath = server.privateKeyPath;
    h.server.hostKeyFingerprint = server.hostKeyFingerprint;
    h.server.connectTimeout = server.connectTimeout;
    markDirty();
    return true;
  }

  for (const svc of drawerCtx.host.services) {
    const keepPwd = svc.server.password;
    const keepPP = svc.server.passphrase;
    svc.server.host = server.host;
    svc.server.port = server.port;
    svc.server.username = server.username;
    svc.server.password = server.password !== undefined ? server.password : keepPwd;
    svc.server.passphrase = server.passphrase !== undefined ? server.passphrase : keepPP;
    svc.server.privateKeyPath = server.privateKeyPath;
    svc.server.hostKeyFingerprint = server.hostKeyFingerprint;
    svc.server.connectTimeout = server.connectTimeout;
  }
  markDirty();
  return true;
}

async function testConnFlow(){
  const resEl = document.getElementById('testRes');
  let server, serviceName = null;
  if (drawerCtx && document.getElementById('dHost')) {
    server = collectDrawerServer();
  } else {
    applyServiceForm();
    const d = currentService();
    if (!d) return;
    server = JSON.parse(JSON.stringify(d.server || {}));
    serviceName = d.name;
    // hostRef 引用库内主机时以前端掌握的库值补齐探测参数
    if (d.hostRef && state.config) {
      const h = (state.config.hosts || []).find(x => x.name.toLowerCase() === d.hostRef.toLowerCase());
      if (h && h.server) {
        server.host = server.host || h.server.host;
        server.port = server.port || h.server.port;
        server.username = server.username || h.server.username;
        server.privateKeyPath = server.privateKeyPath || h.server.privateKeyPath;
        server.hostKeyFingerprint = server.hostKeyFingerprint || h.server.hostKeyFingerprint;
        if (!server.password) server.password = h.server.password;
        if (!server.passphrase) server.passphrase = h.server.passphrase;
      }
    }
  }
  if (!server.host) { toast('请先填写主机地址'); return; }
  if (resEl) resEl.innerHTML = '<span class="dot dot--run"></span> 测试中…';
  try {
    const res = await API.testConnect(serviceName, server);
    if (resEl) resEl.innerHTML = `<span class="dot dot--ok"></span> 通过 · ${res.latencyMs}ms`;
  } catch (e) {
    // test-connect 端点对不可达主机返回 200 + status:error，此处处理后端异常
    if (resEl) resEl.innerHTML = `<span class="dot dot--err"></span> ${esc(e.message).slice(0, 60)}`;
    toast('连通性测试失败：' + e.message);
  }
}

function closeDrawer(){
  document.getElementById('backdrop').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
  /* 同步回收深链，避免后续重渲染时抽屉自行弹回 */
  if (app.view === 'hosts' && app.arg) {
    app.arg = null;
    if (location.hash.indexOf('#/hosts/') === 0) {
      history.replaceState(null, '', location.pathname + location.search + '#/hosts');
    }
  }
}

/* ============================================================
   渲染 & 路由
   ============================================================ */
function render(){
  const { view, arg } = app;
  document.getElementById('content').innerHTML = (() => {
    if (!state.ready && view !== 'spaces') return offlinePanel();
    switch (view) {
      case 'orchestration': return viewOrchestration();
      case 'execution':     return viewExecution();
      case 'hosts':         return viewHosts();
      case 'keys':          return viewKeys();
      case 'spaces':        return viewSpaces();
      case 'service':       return viewService();
      case 'hooks':         return viewHooks();
      case 'history':       return viewHistory();
      case 'batch':         return viewBatch();
      case 'settings':      return viewSettings();
      default:              return viewOrchestration();
    }
  })();
  renderTopbar();
  renderSide();
  renderStatus();

  if (view === 'execution') refillLog();

  bind();

  /* 主机编辑抽屉支持深链：#/hosts/<hostKey> */
  if (view === 'hosts' && arg) openHostDrawer(arg);
}

async function startDeployFlow(extra){
  ensureSSE();
  const opts = Object.assign({ workspace: state.activeWs }, extra || {});
  try {
    // 在发起请求前清理上一批次状态，避免与 batch_started 事件产生先后竞态
    if (!state.deploy || state.deploy.status !== 'running') {
      state.deploy = null;
      state.logBuffer = [];
      state.logCount = 0;

    await API.deploy(opts);

    if (e.status === 409) {
      toast('已有部署任务正在运行，已跳转执行监控');
      ensureSSE();
      go('#/execution');

/* 导入私钥：本地读取文件内容，可选 passphrase（仅用于解析指纹，不存储） */
function importKeyFlow(){
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      const content = String(reader.result || '');
      const passphrase = prompt('私钥口令（无口令请留空；仅用于解析指纹，不会被存储）');
      if (passphrase === null) return;
      try {
        await API.importKey(file.name, content, passphrase, state.activeWs);
        state.keysLoaded = false;
        toast('私钥 ' + file.name + ' 已导入', 'ok');
        render();
      } catch (e) {
        toast('导入失败：' + e.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

  if (!confirm('确认删除私钥 ' + name + '？')) return;
  try {
    await API.deleteKey(name, state.activeWs);

    toast('私钥 ' + name + ' 已删除', 'ok');

  if (!state.config) return;

  let i = state.config.hosts.length + 1;
  let name = 'host-' + String(i).padStart(2, '0');
  while (state.config.hosts.some(h => h.name === name)) { i++; name = 'host-' + String(i).padStart(2, '0'); }
  state.config.hosts.push({ name, server: { host: '', port: 22, username: '', connectTimeout: 15 } });
  markDirty();
  openLibHostDrawer(name);
}

/* 移出主机库（被 hostRef 引用时拒绝，后端校验同样兜底） */
function deleteLibraryHostFlow(name){
  const referenced = cfgServices().some(s => (s.hostRef || '').toLowerCase() === name.toLowerCase());
  if (referenced) { toast('主机 ' + name + ' 正被服务通过 hostRef 引用，请先解除引用'); return; }
  if (!confirm('确认将主机 ' + name + ' 移出主机库？')) return;
  state.config.hosts = (state.config.hosts || []).filter(h => h.name !== name);
  markDirty();
  toast('主机 ' + name + ' 已移出主机库，点击「保存配置」落盘', 'ok');
  render();
}

function newServiceFlow(){
  const list = cfgServices();
  const base = JSON.parse(JSON.stringify(list[0] || null));
  if (!base) { toast('请先在 deploy.json 中配置首个服务'); return; }
  let i = 1;
  while (list.some(s => s.name === base.name + '-copy' + (i > 1 ? i : ''))) i++;
  base.name = base.name + '-copy' + (i > 1 ? i : '');
  state.config.services.push(base);
  markDirty();
  toast('已复制 ' + list[0].name + ' → ' + base.name + '，保存前请修改主机与服务名', 'ok');
  go('#/services/' + encodeURIComponent(base.name));
}

function deleteServiceFlow(){
  const d = currentService();
  if (!d) return;
  if (!confirm('确认删除服务 ' + d.name + '？保存配置后生效。')) return;
  state.config.services = state.config.services.filter(s => s !== d);
  markDirty();
  toast('服务 ' + d.name + ' 已移除，点击「保存更改」落盘', 'ok');
  go('#/orchestration');
}

const ACTIONS = {
  'save':            () => saveConfigFlow(),
  'save-settings':   () => saveSettingsFlow(),
  'deploy':          () => startDeployFlow(app.scenario ? { scenario: app.scenario } : {}),
  'deploy-service':  () => { const d = currentService(); startDeployFlow(d ? { targetServices: [d.name] } : {}); },
  'cancel':          () => cancelDeployFlow(),
  'replay':          () => { const rec = state.batch; startDeployFlow(rec && rec.scenario ? { scenario: rec.scenario } : {}); },
  'export-report':   () => { if (app.view === 'history') exportAllHistory(); else exportBatchReport(); },
  'compare':         () => compareWithPrev(),
  'new-service':     () => newServiceFlow(),
  'new-host':        () => createLibraryHostFlow(),
  'new-key':         () => importKeyFlow(),
  'type-filter':     () => {
    const cycle = ['全部类型', 'standard', 'exec_only', 'sync_only'];
    app.typeFilter = cycle[(cycle.indexOf(app.typeFilter) + 1) % cycle.length];
    render();
  },
  'refresh-history': () => { state.historyLoaded = false; render(); },
  'retry-init':      () => bootstrap(),
  'delete-service':  () => deleteServiceFlow(),
  'duplicate':       () => newServiceFlow(),
  'close-drawer':    closeDrawer,
  'save-drawer':     () => {
    if (applyDrawer()) {
      closeDrawer();
      toast(drawerCtx && drawerCtx.mode === 'library'
        ? '主机库已更新，点击「保存配置」落盘'
        : '主机配置已回写引用服务，点击「保存配置」落盘', 'ok');
    }
  },
  'test-conn':       () => testConnFlow(),
  'pick-local':      async () => {
    try {
      const res = await API.pickPath('folder');
      if (res && res.path) { const el = document.getElementById('fLocalPath'); if (el) el.value = res.path; }
      else if (res && res.status === 'canceled') toast('已取消选择');
    } catch (e) { toast('路径选择失败：' + e.message); }
  },
  'add-exclude':     () => {
    const d = currentService();
    if (!d) return;
    const rule = (prompt('新增排除规则（支持通配符，如 *.log）') || '').trim();
    if (!rule) return;
    d.upload = d.upload || {};
    d.upload.exclude = d.upload.exclude || [];
    d.upload.exclude.push(rule);
    markDirty();
    render();
  },
  'manage-space':    () => { toggleSpaceMenu(false); go('#/spaces'); },
  'new-space':       () => { toggleSpaceMenu(false); createSpaceFlow(); }
};

function bind(){
  const c = document.getElementById('content');

  /* 搜索框（编排台）—— 保持焦点与光标位置 */
  const search = document.getElementById('svcSearch');
  if (search) {
    search.oninput = () => {
      app.search = search.value;
      const pos = search.selectionStart;
      render();
      const el = document.getElementById('svcSearch');
      if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
    };
  }

  /* 分组 / 场景下拉（编排台）—— 侧栏折叠后接管筛选 */
  const grpSel = document.getElementById('grpSel');
  if (grpSel) {
    grpSel.onchange = () => {
      const v = grpSel.value;
      app.group = v.indexOf('g:') === 0 ? v.slice(2) : null;
      app.scenario = v.indexOf('s:') === 0 ? v.slice(2) : null;
      render();
    };
  }

  /* 服务名 → 服务配置页 */
  c.querySelectorAll('[data-svc]').forEach(el => {
    el.onclick = () => go('#/services/' + encodeURIComponent(el.dataset.svc));
  });

  /* 表格行 → 批次详情 */
  c.querySelectorAll('[data-batch]').forEach(el => {
    el.onclick = () => go('#/history/' + encodeURIComponent(el.dataset.batch));
  });

  /* 表格行 → 主机编辑抽屉（走哈希，保持可深链） */
  c.querySelectorAll('[data-host]').forEach(el => {
    el.onclick = () => go('#/hosts/' + encodeURIComponent(el.dataset.host));
  });

  /* 内部跳转 */
  c.querySelectorAll('[data-go]').forEach(el => {
    el.onclick = () => go(el.dataset.go);
  });
  document.getElementById('topbar').querySelectorAll('[data-go]').forEach(el => {
    el.onclick = () => go(el.dataset.go);
  });

  /* 单行「部署」 */
  c.querySelectorAll('[data-deploy-svc]').forEach(el => {
    el.onclick = ev => { ev.stopPropagation(); startDeployFlow({ targetServices: [el.dataset.deploySvc] }); };
  });

  /* 空间卡片：切换 / 删除 */
  c.querySelectorAll('.space-card').forEach(el => {
    el.onclick = () => switchSpaceFlow(el.dataset.space);
  });
  c.querySelectorAll('[data-del-space]').forEach(el => {
    el.onclick = ev => { ev.stopPropagation(); deleteSpaceFlow(el.dataset.delSpace); };
  });

  /* 主机库行 → 库内编辑抽屉；移出主机库 */
  c.querySelectorAll('[data-lib-host]').forEach(el => {
    el.onclick = () => openLibHostDrawer(el.dataset.libHost);
  });
  c.querySelectorAll('[data-del-lib-host]').forEach(el => {
    el.onclick = ev => { ev.stopPropagation(); deleteLibraryHostFlow(el.dataset.delLibHost); };
  });

  /* 密钥删除 */
  c.querySelectorAll('[data-del-key]').forEach(el => {
    el.onclick = ev => { ev.stopPropagation(); deleteKeyFlow(el.dataset.delKey); };
  });

  /* 任务类型 / 启用状态分段（服务配置页，内存态 + 脏标记，保存时统一收集） */
  c.querySelectorAll('[data-svc-type]').forEach(el => {
    el.onclick = () => {
      c.querySelectorAll('[data-svc-type]').forEach(b => b.classList.remove('on'));
      el.classList.add('on');
      markDirty();
    };
  });
  c.querySelectorAll('#fEnabled [data-on]').forEach(el => {
    el.onclick = () => {
      c.querySelectorAll('#fEnabled [data-on]').forEach(b => b.classList.remove('on'));
      el.classList.add('on');
      markDirty();
    };
  });

  /* 排除规则删除 */
  c.querySelectorAll('[data-del-exclude]').forEach(el => {
    el.onclick = () => {
      const d = currentService();
      if (!d || !d.upload || !d.upload.exclude) return;
      d.upload.exclude = d.upload.exclude.filter(x => x !== el.dataset.delExclude);
      markDirty();
      render();
    };
  });

  /* 清理远端目录开关 */
  const sw = document.getElementById('swClean');
  if (sw) sw.onclick = () => {
    const d = currentService();
    if (!d) return;
    d.upload = d.upload || {};
    d.upload.cleanRemote = !d.upload.cleanRemote;
    markDirty();
    render();
  };

  /* 钩子命令增删（批次钩子页） */
  c.querySelectorAll('[data-add-hook]').forEach(el => {
    el.onclick = () => {
      const key = el.dataset.addHook;
      const cmd = (prompt('新增钩子命令') || '').trim();
      if (!cmd) return;
      state.config.hooks = state.config.hooks || {};
      state.config.hooks[key] = state.config.hooks[key] || [];
      state.config.hooks[key].push(cmd);
      markDirty();
      render();
    };
  });
  c.querySelectorAll('[data-del-hook]').forEach(el => {
    el.onclick = () => {
      const parts = el.dataset.delHook.split(':');
      const key = parts[0], idx = parseInt(parts[1], 10);
      const hooks = state.config && state.config.hooks;
      if (hooks && hooks[key] && hooks[key][idx] != null) {
        hooks[key].splice(idx, 1);
        markDirty();
        render();
      }
    };
  });

  /* 各视图本地搜索（纯前端过滤） */
  const bindLocalSearch = (id, fn) => {
    const el = document.getElementById(id);
    if (el) el.oninput = () => fn(el.value);
  };
  /* 各视图本地搜索（纯前端过滤，不重渲染避免丢焦点） */
  bindLocalSearch('hostSearch', v => filterTableRows(v));
  bindLocalSearch('keySearch', v => filterTableRows(v));
  bindLocalSearch('spaceSearch', v => filterSpaceCards(v));
  bindLocalSearch('histSearch', v => filterTableRows(v));

  /* 动作按钮 */
  c.querySelectorAll('[data-act]').forEach(el => {
    const fn = ACTIONS[el.dataset.act];
    if (fn) el.onclick = fn;
  });

  /* 抽屉动作按钮在其打开时由 bindDrawerActions() 绑定（内容为动态注入） */

  /* 顶栏动作 */
  document.getElementById('topbar').querySelectorAll('[data-act]').forEach(el => {
    const fn = ACTIONS[el.dataset.act];
    if (fn) el.onclick = fn;
  });
}

/* 表格本地过滤：隐藏不匹配的行（不重渲染，避免丢焦点） */
function filterTableRows(q, col){
  const kw = (q || '').toLowerCase();
  document.querySelectorAll('#content .tbl-row').forEach(row => {
    if (row.querySelector('.tbl-head')) return;
    const txt = row.textContent.toLowerCase();
    row.style.display = (!kw || txt.includes(kw)) ? '' : 'none';
  });
}
function filterSpaceCards(q){
  const kw = (q || '').toLowerCase();
  document.querySelectorAll('.space-card').forEach(card => {
    card.style.display = (!kw || card.textContent.toLowerCase().includes(kw)) ? '' : 'none';
  });
}

function toggleSpaceMenu(force){
  const m = document.getElementById('spaceMenu');
  if (!m) return;
  const on = typeof force === 'boolean' ? force : !m.classList.contains('show');
  m.classList.toggle('show', on);
}

/* ============================================================
   路由
   ============================================================ */
function route(){
  const p = parseHash();
  let view = p.view;

  if (view === 'services') view = 'service';
  if (view === 'history' && p.arg) view = 'batch';
  if (!['orchestration','execution','hosts','keys','spaces','service','hooks','history','batch','settings'].includes(view)) {
    view = 'orchestration';
  }

  /* 先清理上一层视图留下的浮层状态，再写入新的 view/arg —— 顺序颠倒会把刚解析出的深链清掉 */
  closeDrawer();
  toggleSpaceMenu(false);

  app.view = view;
  /* 直接进入详情路由但缺 id 时回落到首条记录，避免出现「批次 #」这种空面包屑 */
  if (view === 'batch')        app.arg = p.arg || (state.history[0] && state.history[0].id) || null;
  else if (view === 'service') app.arg = p.arg || (cfgServices()[0] && cfgServices()[0].name) || null;
  else if (view === 'hosts')   app.arg = p.arg || null;   /* #/hosts/<hostKey> 深链直达编辑抽屉 */
  else                         app.arg = null;

  const c = document.getElementById('content');
  if (c) c.scrollTop = 0;

  render();
}

/* 点击空白处关闭浮层 */
document.addEventListener('click', e => {
  if (!e.target.closest('.space-switch')) toggleSpaceMenu(false);
});
document.getElementById('backdrop').onclick = closeDrawer;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDrawer(); toggleSpaceMenu(false); }
});

window.addEventListener('hashchange', route);

/* ============================================================
   启动引导：拉取工作空间与配置 → 首次渲染 → 建立 SSE → 预热指标
   ============================================================ */
async function bootstrap(){
  try {
    const ws = await API.workspaces();
    state.workspaces = ws.workspaces || [];
    state.activeWs = ws.active || 'default';
    state.config = await API.config(state.activeWs);
    state.ready = true;
  } catch (e) {
    state.ready = false;
  }
  route();
  if (state.ready) {
    ensureSSE();
    loadHistory().then(() => { if (app.view === 'orchestration') renderStatus(); });
    API.settings().then(st => { state.settings = st; state.settingsLoaded = true; renderStatus(); }).catch(() => {});
  }
}

if (!location.hash) {
  location.replace(location.pathname + '#/orchestration');
}
bootstrap();
</script>
